name: Build svl Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: svl-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare offline signer for local personalization
        run: |
          mkdir -p signing
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar -type f | sort -V | tail -1)
          echo "Using signer: $SIGNER"
          cp "$SIGNER" signing/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: svl-apk-signing-tool
          path: signing/apksigner.jar
